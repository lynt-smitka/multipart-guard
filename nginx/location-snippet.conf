# multipart-guard – variant for a location {} (e.g. inside "location ~ \.php$ { ... }") when you cannot
# add anything at server level. Inside if() only proxy_pass is allowed, the parameters live at location level
# (harmless for fastcgi).
include /etc/nginx/multipart-guard-proxy.conf;
if ($mg_to_guard) { proxy_pass http://multipart_guard; }
