# multipart-guard – put this at the TOP of every server {} block that serves PHP (or into a shared include
# that all your server blocks use). Uses the "return 418 + error_page = @named" trick because proxy_pass is
# not allowed inside if() at server level; a named location keeps the method and the request body.
if ($mg_to_guard) { return 418; }
error_page 418 = @multipart_guard;
location @multipart_guard { include /etc/nginx/multipart-guard-proxy.conf; proxy_pass http://multipart_guard; }
# optional: hide the token from the application
# fastcgi_param HTTP_X_MULTIPART_GUARD "";
