# multipart-guard – proxy parameters (e.g. /etc/nginx/multipart-guard-proxy.conf).
# Included from location @multipart_guard (server context) or from a location (if + proxy_pass).
# No proxy_pass here: inside if() only proxy_pass is allowed, the rest is inherited from the location.
proxy_http_version 1.1;
proxy_request_buffering off;
proxy_connect_timeout 2s;
proxy_send_timeout 600s;
proxy_read_timeout 600s;
proxy_next_upstream off;
proxy_intercept_errors off;
proxy_redirect off;
# client headers pass unchanged (X-Forwarded-For, CF-Connecting-IP, Cookie …); only these are added:
proxy_set_header Host $mg_host;
proxy_set_header Connection "";
proxy_set_header X-Guard-Orig-IP $remote_addr;
proxy_set_header X-Guard-Orig-Proto $scheme;
proxy_set_header X-Guard-Orig-Port $server_port;
