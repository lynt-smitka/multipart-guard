# multipart-guard – http context (e.g. /etc/nginx/conf.d/00-multipart-guard.conf).
# Requests with Content-Type multipart/form-data that do NOT carry a valid X-Multipart-Guard token are routed
# to the guard. The guard sends them back with the token, so the second pass goes straight to the application.
upstream multipart_guard {
    server 127.0.0.1:8090;
    keepalive 16;
}
map $content_type $mg_is_multipart {
    default                   0;
    "~*^multipart/form-data"  1;
}
# The token is a regex key on purpose: a long static key would need map_hash_bucket_size, which cannot be set
# when another map precedes this file. Replace __TOKEN__ with the value of "token" from the guard config.
map $http_x_multipart_guard $mg_token_ok {
    default          0;
    "~^__TOKEN__$"   1;
}
# Master switch: "1:0" = multipart without token → guard. Set the value to 0 to disable routing.
map "$mg_is_multipart:$mg_token_ok" $mg_to_guard {
    default  0;
    "1:0"    1;
}
# Host passed to the guard: $http_host keeps the port, but is empty for HTTP/3 (nginx does not map :authority
# into $http_host), so fall back to $host – otherwise nginx would send the upstream name as Host.
map $http_host $mg_host {
    default  $http_host;
    ""       $host;
}
# The second pass comes from loopback; the guard sends the original client IP in X-Guard-Orig-IP.
# If your nginx.conf already has real_ip_header (e.g. CF-Connecting-IP), remove the line below and add that
# header name to real_ip_headers in the guard config instead.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header X-Guard-Orig-IP;
